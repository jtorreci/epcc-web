<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Modern geometric sprite for the middle parallax layer. Stroke colour,
       width and dash state are inherited from the referencing <use>. -->
  <defs>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0b90b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f0b90b;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="grad-soft" x1="0%" y1="0%" x2="100%" y2="100%">
