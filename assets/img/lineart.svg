    <radialGradient id="grad-radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:currentColor;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:currentColor;stop-opacity:0.1" />
